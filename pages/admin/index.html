<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#153c70"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.github.com https://raw.githubusercontent.com https://*.trycloudflare.com; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>내 관리자 바로가기 · 알파작업완료확인 프로그램</title><link rel="icon" href="../phone/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="admin.css?v=2.36.0"><script defer src="admin.js?v=2.36.0"></script><script defer src="passkeys.js?v=2.36.3"></script></head><body><main><section class="entry-card"><span class="mark" aria-hidden="true">α</span><span class="eyebrow">MY MOBILE WORKSPACE</span><h1>내 관리자 바로가기</h1><p class="intro">QR 없이, 회사 PC의 관리자 화면으로.</p><button class="primary" id="open-admin" type="button">관리자 화면 열기 <span aria-hidden="true">→</span></button><button class="biometric" id="fingerprint-login" type="button">지문·패스키로 로그인</button><section id="passkey-flow" hidden><h2 id="passkey-title">지문 확인</h2><p id="passkey-description"></p><button class="primary" id="passkey-confirm" type="button">지문으로 확인</button><p id="passkey-status" role="status"></p></section><p id="status" role="status">회사 PC의 최신 연결 주소로 이동합니다.</p><div class="save-card"><h2>이 페이지를 저장해 두세요</h2><p>휴대폰 브라우저 메뉴에서 <strong>즐겨찾기</strong> 또는 <strong>홈 화면에 추가</strong>를 선택하세요.</p><label for="shortcut-url">변하지 않는 관리자 바로가기 주소</label><input id="shortcut-url" type="url" readonly value="https://swsgood79-beep.github.io/Tool/admin/"><button class="quiet" id="copy-url" type="button">주소 복사</button><p id="copy-status" role="status"></p></div><p class="foot">회사 PC·프로그램·인터넷 연결이 켜져 있어야 합니다.<br>PC에서 설정한 관리자 비밀번호로 로그인하세요.<br>비밀번호는 이 바로가기 페이지에 입력하지 않습니다.</p></section></main></body></html>
