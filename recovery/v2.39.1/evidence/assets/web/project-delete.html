{{define "project-delete.html"}}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수주 삭제 · 알파작업완료확인 프로그램</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="brand"><span class="mark">α</span> 알파작업완료확인 프로그램</span><a href="/">관리자 화면으로</a></header><main class="narrow"><section class="card"><h1>수주 삭제</h1>{{range .Projects}}<span class="pill">수주 {{.Number}}</span><h2 class="delete-project-name">{{.Name}}</h2><p>이 수주를 관리자 목록과 작업자 화면에서 삭제합니다. 삭제한 수주는 복원할 수 없습니다.</p><p class="notice">완료 처리 전인 검사 신청은 함께 삭제됩니다. 기존 완료 접수와 엑셀 기록은 보관됩니다. 완료 기록도 지우려면 완료 접수의 ‘수정 → 기록 삭제’를 이용하세요.</p><form method="post" action="/projects/{{.ID}}/delete"><input type="hidden" name="csrf" value="{{$.CSRF}}"><label class="check-label"><input type="checkbox" name="confirm" value="1" required> 위 수주를 삭제하는 것을 확인했습니다.</label><button class="danger full">수주 삭제 확정</button></form>{{end}}<a class="button quiet full" href="/">돌아가기</a></section></main></body></html>{{end}}
