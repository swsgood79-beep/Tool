{{define "client-picker"}}<fieldset class="client-picker-tools"><legend>업체별 특이사항 불러오기</legend><label for="client-template-picker">등록된 업체 선택</label><select id="client-template-picker"><option value="">업체 선택</option>{{range .ClientNotes}}<option value="{{.ID}}" {{if eq $.SelectedClient .ID}}selected{{end}}>{{.Name}}</option>{{end}}</select><input type="hidden" name="client_template_id" id="client-template-id"><input type="hidden" name="client_template_revision" id="client-template-revision"><input type="hidden" name="keep_client_link" value="{{if .SelectedClient}}1{{else}}0{{end}}"><label class="check-label"><input type="checkbox" name="sync_client" value="1" checked> 업체 원본 변경을 기존 수주에도 자동 반영</label><p class="small muted">연결된 글·사진은 업체 원본을 수정하면 함께 갱신됩니다. 수주에만 적용할 내용은 자동 반영을 해제하고 저장하세요.</p><div class="client-picker-actions"><button type="button" class="quiet" id="load-client-note">업체 특이사항 불러오기</button><button type="button" class="quiet" id="reload-client-notes">업체 목록 새로고침</button><a href="/client-notes" target="_blank" rel="noreferrer">업체 특이사항 관리 ↗</a></div><p class="small muted" id="client-picker-status" role="status">불러오면 특이사항 글이 선택 업체의 내용으로 바뀝니다. 기존 첨부 사진은 유지합니다.</p><div id="client-template-photos" class="project-photo-grid"></div></fieldset>{{end}}
