{{define "client-note-edit.html"}}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업체 특이사항 수정 · 알파작업완료확인 프로그램</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="brand"><span class="mark">α</span> 알파작업완료확인 프로그램</span><a href="/client-notes">업체 목록으로</a></header><main><section class="card client-directory"><h1>업체 특이사항 수정</h1>{{with .ClientNote}}{{$note := .}}<form method="post" action="/client-notes" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="action" value="save"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="revision" value="{{.Revision}}"><label>업체명<input name="client_name" value="{{.Name}}" required maxlength="80"></label><label for="client-edit-text">업체 공통 특이사항</label><textarea id="client-edit-text" name="client_text" rows="8" maxlength="5000">{{.Text}}</textarea><label>업체 사진 추가<input type="file" name="photos" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><p class="small muted">업체 원본은 글 최대 5,000자·사진 합계 5장입니다. 이 원본을 수정하면 자동 반영이 연결된 수주도 갱신됩니다. 원본 삭제 시 수주에는 마지막 내용이 남습니다.</p><div class="project-photo-grid">{{range .Photos}}<figure class="project-photo"><a href="/client-notes/{{$note.ID}}/photos/{{.ID}}" target="_blank" rel="noreferrer"><img src="/client-notes/{{$note.ID}}/photos/{{.ID}}" alt="{{.Name}}" loading="lazy"></a><figcaption>{{.Name}}</figcaption><label class="check-label"><input type="checkbox" name="remove_photo" value="{{.ID}}"> 업체 사진 삭제</label></figure>{{end}}</div><button class="primary">업체 수정 저장</button></form><form class="edit-panel" method="post" action="/client-notes"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{.ID}}"><input type="hidden" name="revision" value="{{.Revision}}"><button class="danger">업체 원본 삭제</button></form>{{end}}</section></main></body></html>{{end}}
