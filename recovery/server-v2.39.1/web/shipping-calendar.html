{{define "shipping-calendar"}}<dialog id="shipping-calendar" class="shipping-calendar" aria-labelledby="shipping-calendar-title"><div class="calendar-header"><h2 id="shipping-calendar-title">출고 일정</h2><button type="button" class="calendar-close" aria-label="출고 일정 캘린더 닫기">✕</button></div><div class="calendar-body"><div class="calendar-navigation"><button type="button" id="calendar-prev" aria-label="이전 달">‹</button><h3 id="calendar-month" aria-live="polite"></h3><button type="button" id="calendar-next" aria-label="다음 달">›</button><button type="button" id="calendar-today">오늘</button></div><p class="calendar-month-summary" id="calendar-month-summary"></p><table class="calendar-table" aria-label="월별 출고 예정일"><thead><tr><th scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th><th scope="col">토</th></tr></thead><tbody id="calendar-days"></tbody></table><p class="calendar-legend"><span aria-hidden="true">●</span> 출고 예정 수주 <span class="muted">· 날짜를 누르면 해당 수주가 표시됩니다</span></p><section class="calendar-selection" aria-label="선택한 날짜의 수주"><div class="calendar-selection-heading"><h3 id="calendar-selected-date"></h3><span id="calendar-selected-count" class="calendar-total" role="status" aria-live="polite"></span></div><div id="calendar-orders"></div></section><div class="calendar-footer"><button type="button" id="calendar-undated" aria-pressed="false">날짜 미정 <span>0건</span></button><span>출고 예정일 기준 · 검사 완료 수주 포함</span></div></div></dialog>{{end}}
