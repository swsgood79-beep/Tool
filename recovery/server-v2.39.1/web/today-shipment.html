{{define "today-shipment"}}<section class="card today-item" data-setting-worker="{{.SettingWorker}}" data-shipping-worker="{{.ShippingWorker}}" data-project="{{.ProjectID}}" data-order="{{.Number}}" data-name="{{.Name}}" data-info="{{.InfoURL}}" data-photos="{{.PhotoCount}}"><div class="work-name"><div class="project-topline"><span class="pill order-number">수주 {{.Number}}</span>{{if .InfoURL}}<a class="special-info-link" href="{{.InfoURL}}">특이사항{{if .PhotoCount}} <span aria-label="첨부 사진 {{.PhotoCount}}장">▧ {{.PhotoCount}}</span>{{end}}</a>{{end}}</div><h2>{{.Name}}</h2><div class="completed-workers">{{if .SettingWorker}}<p>세팅 작업자 · {{.SettingWorker}}</p>{{end}}{{if .ShippingWorker}}<p>출하 작업자 · {{.ShippingWorker}}</p>{{end}}</div></div><span class="badge success">✓ 검사 완료</span></section>{{end}}
