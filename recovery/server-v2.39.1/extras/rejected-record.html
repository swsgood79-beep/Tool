{{define "rejected-record.html"}}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반려된 검사 신청</title><link rel="stylesheet" href="/style.css"></head><body><header><span class="brand">α 검사 신청 기록</span><a href="/">관리자 화면</a></header><main><section class="card"><h1>반려된 검사 신청</h1>{{with .Record}}<p><b>{{.Order}} · {{.Project}}</b></p><p>{{.InspectionName}} · 신청자 {{.Worker}}</p><p>반려 {{kst .RejectedAt}}</p>{{if .Note}}<p class="special-instructions">{{.Note}}</p>{{end}}<p class="notice">검사 완료 기록이 아닙니다. 작업자가 다시 신청해야 검사를 진행할 수 있습니다.</p><a class="button primary" href="/projects/{{.ProjectID}}/inspection">현재 수주 검사 화면</a><form method="post" action="/records/{{.ID}}/edit"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="revision" value="{{.Revision}}"><input type="hidden" name="action" value="delete"><label><input type="checkbox" name="confirm" value="1" required> 이 반려 기록만 삭제합니다.</label><button class="danger">반려 기록 삭제</button></form>{{end}}</section></main></body></html>{{end}}
